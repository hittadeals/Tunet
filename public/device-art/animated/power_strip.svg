  <circle cx="71.92173913043479" cy="65.83478260869566" r=".9" fill="#5b6168"/><circle cx="77.12173913043478" cy="65.03478260869565" r=".9" fill="#5b6168"/><rect x="73.92173913043479" y="62.03478260869566" width="1.2" height="1.6" fill="#9aa2ab"/>
