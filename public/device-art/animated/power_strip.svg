  <circle cx="92.7913043478261" cy="63.22608695652173" r=".9" fill="#5b6168"/><circle cx="97.99130434782609" cy="62.426086956521736" r=".9" fill="#5b6168"/><rect x="94.7913043478261" y="59.426086956521736" width="1.2" height="1.6" fill="#9aa2ab"/>
