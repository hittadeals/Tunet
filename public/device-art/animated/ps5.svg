  <g class="ps-btn"><circle cx="104" cy="117.6" r=".9"/><circle cx="106" cy="119.6" r=".9"/><circle cx="104" cy="121.6" r=".9"/><circle cx="102" cy="119.6" r=".9"/></g>
</g></g></g>
</svg>
